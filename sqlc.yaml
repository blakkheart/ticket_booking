version: "2"
sql:
  - engine: "postgresql"
    queries: "./repository/queries"
    schema: "./repository/migrations"
    gen:
      go:
        emit_json_tags: true
        emit_pointers_for_null_types: true
        package: "repository"
        out: "./repository"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "timestamptz"
            go_type:
              type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "*time.Time"
          - db_type: "pgtype.Timestamp"
            go_type:
              type: "time.Time"
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - column: "account.role"
            go_type: "ticket-booking/domain/model.Role"
